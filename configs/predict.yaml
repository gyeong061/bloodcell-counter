# 추론 설정 — app.py · backend · predict · evaluate 공용
# 본학습 모델: TXL-PBC 882장 · YOLO11s · 100 epoch (Colab T4)
weights: runs/detect/txl_yolo11s_s42/weights/best.pt
device: auto

parameters:
  conf: 0.25
  iou: 0.5              # 혈구가 서로 붙어 있어 NMS를 조금 엄격하게
  imgsz: 640
  max_det: 300

# 이 값보다 낮은 신뢰도 검출이 많으면 "직접 검토" 표시
low_conf_threshold: 0.4

# 클래스별 임계값 (선택). evaluate.py 결과의 tuned_conf_from_val 값을 옮겨 적으면
# 카운트 오차가 가장 작은 설정으로 서비스됩니다. 비워 두면 parameters.conf 사용.
# 아래 값은 txl_yolo11s_s42를 TXL-PBC val(242장)에서 탐색한 결과 (runs/eval/txl_yolo11s_s42/eval_summary.yaml)
# 넓은 시야 도말 val(57장)만으로 탐색해도 같은 값이 나왔습니다.
class_conf:
  RBC: 0.7
  WBC: 0.25
  Platelets: 0.6
