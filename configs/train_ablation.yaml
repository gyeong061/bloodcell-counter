# 라벨 품질 통제 실험 — 이미지·설정은 같고 라벨만 다른 두 데이터로 학습
# CPU에서도 돌 수 있게 YOLO11n · 30 epoch (Colab이면 epochs를 늘려도 됨)
# 실행 예: python -m bloodcount.train --config configs/train_ablation.yaml \
#            --data data/ablation/txl_labels/data.yaml --name abl_txl_labels
model: yolo11n.pt
device: auto

hyperparameters:
  epochs: 30
  batch: 16
  imgsz: 640
  patience: 30          # 30 epoch을 모두 돌려 두 실험 조건을 똑같이
  workers: 2
  project: runs/detect
  seed: 42
  pretrained: true
  optimizer: auto
  cos_lr: true
  close_mosaic: 5
  exist_ok: true

augmentation:
  flipud: 0.5
  fliplr: 0.5
  hsv_h: 0.02
  hsv_s: 0.5
  hsv_v: 0.3
  degrees: 0.0
  translate: 0.1
  scale: 0.3
  mosaic: 1.0
  mixup: 0.0

oom_fallback_batches: [16, 8, 4]
